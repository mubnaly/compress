name: Build, Test & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify FFmpeg available
        run: |
          ffmpeg -version | head -n 1

      - name: Build frontend
        run: npm run build

      - name: Verify server health endpoint
        run: |
          node server/index.js &
          SERVER_PID=$!
          echo "Waiting for server to start..."
          for i in {1..20}; do
            if curl -s http://127.0.0.1:7317/api/health | grep -q '"ok":true'; then
              echo "Server is healthy!"
              break
            fi
            sleep 1
          done
          curl -f http://127.0.0.1:7317/api/health
          kill $SERVER_PID || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docker-publish:
    name: Build & Publish Container (GHCR)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Cloud Webhook (Render / Railway)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "Triggering cloud deploy webhook..."
            curl -s -X POST "$HOOK" || true
          fi

  build-apk:
    name: Build & Release Android APK
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Build-Tools 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Plico-Video-Compressor.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Plico-Video-Compressor-APK
          path: artifacts/Plico-Video-Compressor.apk
          retention-days: 30

      - name: Create / Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-release
          name: Plico Video Compressor v0.1.0
          body: |
            ### 🎬 Plico Video Compressor v0.1.0

            A 100% offline, privacy-first local video compressor with Svelte 5 UI and managed FFmpeg engine.

            #### 📦 Downloads:
            - **Android APK**: [`Plico-Video-Compressor.apk`](https://github.com/mubnaly/compress/releases/download/v0.1.0-release/Plico-Video-Compressor.apk)
            - **Windows Standalone App**: [`Plico-Video-Compressor.exe`](https://github.com/mubnaly/compress/releases/download/v0.1.0-release/Plico-Video-Compressor.exe)
            - **Web UI (Static)**: [https://mubnaly.github.io/compress/](https://mubnaly.github.io/compress/)
            - **Docker Engine**: `docker run -d -p 7317:7317 ghcr.io/mubnaly/compress:latest`
          files: artifacts/Plico-Video-Compressor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-exe:
    name: Build & Release Windows EXE
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Executable
        run: npm run build:exe

      - name: Upload EXE to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Plico-Video-Compressor-EXE
          path: dist-native/Plico-Video-Compressor.exe
          retention-days: 30

      - name: Add Windows EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-release
          name: Plico Video Compressor v0.1.0
          files: dist-native/Plico-Video-Compressor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
