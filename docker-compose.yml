version: '3.8'

services:
  video-compressor:
    build:
      context: .
      dockerfile: Dockerfile
    image: plico-video-compressor:latest
    container_name: plico-compressor
    restart: unless-stopped
    ports:
      - "7317:7317"
    environment:
      - PORT=7317
      - PLICO_HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
